name: Build Dashing Volume Slider APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: unzip -o Dashing-Volume-Slider-Android-Studio-Project.zip

      - name: Build APK
        working-directory: DashingVolumeSlider
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dashing-Volume-Slider-APK
          path: DashingVolumeSlider/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
